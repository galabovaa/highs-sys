name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Nightly run against the HiGHS development branch, so breakage is noticed
  # before the next HiGHS release.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      highs_ref:
        description: "HiGHS branch, tag or commit to test against (empty = vendored submodule)"
        default: ""
  # Called from the HiGHS repository's CI to test every upstream commit/PR:
  #   uses: rust-or/highs-sys/.github/workflows/rust.yml@master
  workflow_call:
    inputs:
      highs_ref:
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  # Empty means "use the vendored submodule as committed".
  HIGHS_REF: ${{ inputs.highs_ref || (github.event_name == 'schedule' && 'latest') || '' }}

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
    - name: Install LLVM and Clang # required for bindgen to work, see https://github.com/rust-lang/rust-bindgen/issues/1797
      uses: KyleMayes/install-llvm-action@v1.9.0
      if: matrix.config.os == 'windows-latest'
      with:
        version: "17"
        directory: ${{ runner.temp }}/llvm
    - name: Set LIBCLANG_PATH
      run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV
      if: matrix.config.os == 'windows-latest'
    - uses: actions/checkout@v4
      with:
        # When called from another repository (HiGHS), check out highs-sys
        # itself rather than the caller.
        repository: ${{ inputs.highs_ref && 'rust-or/highs-sys' || github.repository }}
        submodules: recursive
    - name: Use HiGHS ${{ env.HIGHS_REF }}
      if: env.HIGHS_REF != ''
      run: git -C HiGHS fetch --depth=1 origin "$HIGHS_REF" && git -C HiGHS checkout FETCH_HEAD
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
    - name: install dependencies
      run: ./install-dependencies.sh
    - name: Build
      run: cargo build
    - name: Run tests
      run: cargo test
    - name: Run tests with static CRT
      if: matrix.config.os == 'windows-latest'
      env:
        RUSTFLAGS: -C target-feature=+crt-static
      run: cargo test
    - name: Build with system-installed HiGHS
      if: matrix.config.os != 'windows-latest'
      run: |
        cd HiGHS
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        sudo cmake --install build
        cd ..
        cargo clean
        cargo build --no-default-features --features "discover"

  wasm-emscripten:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMSDK_VERSION: 5.0.0
      EMSDK_CACHE_FOLDER: emsdk-cache
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.highs_ref && 'rust-or/highs-sys' || github.repository }}
        submodules: recursive
    - name: Use HiGHS ${{ env.HIGHS_REF }}
      if: env.HIGHS_REF != ''
      run: git -C HiGHS fetch --depth=1 origin "$HIGHS_REF" && git -C HiGHS checkout FETCH_HEAD
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
    - name: Setup emsdk
      uses: pyodide/setup-emsdk@v15
      with:
        version: ${{ env.EMSDK_VERSION }}
        actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}
    - name: Build wasm32-unknown-emscripten
      run: |
        rustup target add wasm32-unknown-emscripten
        cargo build --target wasm32-unknown-emscripten

  version-check:
    if: inputs.highs_ref == '' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: ./scripts/check-highs-version.sh
